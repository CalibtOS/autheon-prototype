<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketplace filter button — states gallery</title>
    <!--
      Marketplace filter button + applied-filter badge — states gallery
      =================================================================
      This repository has no Storybook (and no bundler — the prototype is
      static React + Babel-standalone over CDN scripts). This page is the
      equivalent artefact in the repo's own idiom, and is captured by
      tests/regression/driver-marketplace-filter-states.visual.spec.ts.

      Every story mounts the REAL `MarketplaceFilterButton` from driver.jsx and
      drives it with a real committed-filter object, so the stories exercise the
      same `getAppliedMarketplaceFilterCount` derivation the app uses and cannot
      drift from it. The shared `Badge` primitive is additionally exercised on
      its own, per the "test the primitive separately AND in composition" rule.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=25" />
    <style>
      body {
        margin: 0;
        background: var(--canvas);
        font-family: "Inter Tight", system-ui, sans-serif;
        color: var(--text);
      }
      .gallery {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 20px 64px;
      }
      .gallery-title {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .gallery-lede {
        font-size: 13.5px;
        color: var(--muted);
        margin: 0 0 8px;
        max-width: 78ch;
        line-height: 1.5;
      }
      .section-title {
        font-size: 14px;
        font-weight: 600;
        margin: 28px 0 12px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .story-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        align-items: start;
      }
      .story {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .story-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      /* `.phone-shell` is an absolutely-positioned full-viewport stage in the
         app; here it must be inert flow so each story sits in its own card. */
      .story-canvas .phone-shell {
        position: static;
        inset: auto;
        display: block;
        place-items: initial;
        padding: 0;
        overflow: visible;
      }
      .story-canvas {
        border: 1px solid var(--line);
        border-radius: var(--r-3);
        background: var(--paper);
        padding: 14px 18px;
        overflow: hidden;
      }
      .story-canvas[data-width="320"] {
        width: 320px;
      }
      .story--wide {
        grid-column: 1 / -1;
      }
      .story--wide .story-canvas {
        max-width: 720px;
      }
      /* The filter button has no visible text — surface its accessible name so
         the gallery can review translated / long labels visually. */
      .story-a11y {
        font-size: 11px;
        color: var(--muted);
        font-family: var(--font-mono);
        word-break: break-word;
      }
      .badge-strip {
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }
      .badge-strip .ui-badge {
        position: static;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script src="feature-flags.js"></script>
    <script src="i18n.js?v=26"></script>
    <script src="formatters.js"></script>
    <script src="inputFormatters.js"></script>
    <script src="store.js"></script>
    <script type="text/babel" src="driver-ui.jsx"></script>
    <script type="text/babel" src="driver.jsx?v=17"></script>

    <script type="text/babel" data-presets="env,react">
      const { useI18n, MarketplaceFilterButton, SortSelect, Ic } = window;
      const { getAppliedMarketplaceFilters } = window;
      const { Badge } = window.DriverUI || window;

      // Committed-filter fixtures. Max reachable through the real UI grows with
      // multi-select PLZ areas (each prefix counts 1) plus from/to/vehicle/
      // transport — the badge must still render double-digit counts safely.
      const F = {
        none: {},
        one: { startPlz: ["80"] },
        two: { startPlz: ["80"], vehicleType: "passenger_car" },
        three: {
          startPlz: ["80"],
          endPlz: ["10"],
          vehicleType: "passenger_car",
        },
        max: {
          startPlz: ["80"],
          endPlz: ["10"],
          from: "2026-05-01",
          to: "2026-05-30",
          vehicleType: "passenger_car",
          transportType: "own_axle",
        },
        // Values that must NOT be counted.
        nonRestrictive: {
          startPlz: [],
          endPlz: null,
          from: undefined,
          to: "   ",
          vehicleType: "All",
          transportType: "All",
        },
      };

      function Story({ label, width, wide, filters, children }) {
        const { t, tPlural } = useI18n();
        const count = filters
          ? getAppliedMarketplaceFilters(filters).length
          : null;
        return (
          <div className={`story${wide ? " story--wide" : ""}`}>
            <div className="story-label">{label}</div>
            <div className="story-canvas" data-width={width} data-story={label}>
              <div className="phone-shell">{children}</div>
            </div>
            {filters ? (
              <div className="story-a11y">
                aria-label ={" "}
                {count ? tPlural("filtersApplied", count) : t("filters")}
              </div>
            ) : null}
          </div>
        );
      }

      /** The Marketplace results row exactly as `Portal` composes it. */
      function ResultsRow({ filters, results = 2 }) {
        const { t } = useI18n();
        const chips = getAppliedMarketplaceFilters(filters, t);
        return (
          <>
            <div className="portal-results-row">
              <span className="text-caption">
                {results} {t("results")}
              </span>
              <div className="header-controls">
                <SortSelect
                  value="date_desc"
                  onChange={() => {}}
                  options={[
                    ["date_desc", "Newest"],
                    ["date_asc", "Oldest"],
                  ]}
                  label={t("sortJobs")}
                />
                <MarketplaceFilterButton
                  filters={filters}
                  onOpen={() => {}}
                />
              </div>
            </div>
            {chips.length ? (
              <div className="header-chips-row">
                {chips.map((c) => (
                  <button key={c.key} type="button" className="chip">
                    {c.label}{" "}
                    <span className="x" aria-hidden="true">
                      <Ic.X />
                    </span>
                  </button>
                ))}
              </div>
            ) : null}
          </>
        );
      }

      function Gallery() {
        const { t } = useI18n();
        return (
          <div className="gallery">
            <h1 className="gallery-title">
              Marketplace filter button — applied-filter count badge
            </h1>
            <p className="gallery-lede">
              The badge shows how many filters are currently restricting the
              Marketplace result set — <strong>not</strong> how many orders
              matched. Sorting is never counted. The count is derived from the
              committed filter object by{" "}
              <code>getAppliedMarketplaceFilterCount</code>; a count of 0 renders
              no badge element at all.
            </p>

            <div className="section-title">
              Filter button — count states (panel closed)
            </div>
            <div className="story-grid">
              <Story label="No active filters" filters={F.none}>
                <MarketplaceFilterButton filters={F.none} onOpen={() => {}} />
              </Story>
              <Story
                label="Non-restrictive values only (empty / null / defaults)"
                filters={F.nonRestrictive}
              >
                <MarketplaceFilterButton
                  filters={F.nonRestrictive}
                  onOpen={() => {}}
                />
              </Story>
              <Story label="One active filter" filters={F.one}>
                <MarketplaceFilterButton filters={F.one} onOpen={() => {}} />
              </Story>
              <Story label="Multiple active filters (3)" filters={F.three}>
                <MarketplaceFilterButton filters={F.three} onOpen={() => {}} />
              </Story>
              <Story label="Maximum reachable count (6)" filters={F.max}>
                <MarketplaceFilterButton filters={F.max} onOpen={() => {}} />
              </Story>
              <Story
                label="Keyboard focus (focus-visible ring)"
                filters={F.two}
              >
                <MarketplaceFilterButton filters={F.two} onOpen={() => {}} />
              </Story>
            </div>

            <div className="section-title">
              Shared badge primitive — double-digit and cap behaviour
            </div>
            <div className="story-grid">
              <Story label="Badge primitive: 0 / 1 / 9 / 12 / 128">
                <div className="badge-strip">
                  {[0, 1, 9, 12, 128].map((n) => (
                    <span key={n} className="badge-strip-item">
                      <Badge count={n} variant="destructive" />
                      {n === 0 ? (
                        <em style={{ fontSize: 11, color: "var(--muted)" }}>
                          0 → nothing rendered
                        </em>
                      ) : null}
                    </span>
                  ))}
                </div>
              </Story>
              <Story label="Anchored double-digit (12) on the filter button">
                <button
                  type="button"
                  className="header-btn header-filter-btn active"
                  aria-label="Filters, 12 applied"
                >
                  <Ic.Filter />
                  <Badge
                    count={12}
                    variant="destructive"
                    className="header-btn-badge"
                    ariaHidden
                  />
                </button>
              </Story>
              <Story label="Anchored capped count (128 → 99+)">
                <button
                  type="button"
                  className="header-btn header-filter-btn active"
                  aria-label="Filters, 128 applied"
                >
                  <Ic.Filter />
                  <Badge
                    count={128}
                    variant="destructive"
                    className="header-btn-badge"
                    ariaHidden
                  />
                </button>
              </Story>
            </div>

            <div className="section-title">
              Marketplace composition — border treatment shared with sort
            </div>
            <div className="story-grid">
              <Story
                label="Results row — no filters (sort + filter, same treatment)"
                wide
              >
                <ResultsRow filters={F.none} results={2} />
              </Story>
              <Story label="Results row — 3 filters + chip row" wide>
                <ResultsRow filters={F.three} results={1} />
              </Story>
              <Story
                label="Results row — filters active, zero matching orders"
                wide
              >
                <ResultsRow filters={F.max} results={0} />
              </Story>
              <Story label="Narrow mobile (320px)" width="320">
                <ResultsRow filters={F.three} results={1} />
              </Story>
              <Story label="Tablet column (720px)" wide>
                <ResultsRow filters={F.two} results={1} />
              </Story>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Gallery />);
    </script>
  </body>
</html>
